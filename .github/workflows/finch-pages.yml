name: Deploy Finch Cold Case to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'cold-case/**'
      - '.github/workflows/finch-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: finch-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./cold-case
      - id: deployment
        uses: actions/deploy-pages@v4
